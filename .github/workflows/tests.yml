name: Tests

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  non-llm-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Run non-LLM tests
        run: uv run pytest -q -m "not llm"