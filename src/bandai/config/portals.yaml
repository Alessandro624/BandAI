  - name: "TED"
    info: "TED (EU)"
    base_url: "https://www.ted.europa.eu/en/search/result"
    reliability: 0.90
    country_filter: "IT"
        
    discovery:
      base_search_url: "https://ted.europa.eu/en/search/result?FT=Italy"
      elements_per_page: 50
      list_wrapper_selector:
        type: "css"
        text: "table:has( thead)"
      next_page_selector:
        type: "aria-label"
        text: "Go to the next page"
      actions_to_perform: []
        # - selector: 
        #     type: "css"
        #     text: "th:has( #deadline-column-id)"
        #   action_type: "click"
        #   wait_after_action: "networkidle"
    
    extraction:
      base_resource_url: https://ted.europa.eu/
      main_content_selector: 
        type: "css"
        text: "#notice-accordion"

