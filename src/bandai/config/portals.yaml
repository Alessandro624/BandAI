# Procurement portal definitions for the Scout crew.
# Each portal entry defines the source for tender discovery.
#
# - name: Human-readable identifier used throughout the pipeline.
# - base_url: Entry URL for the portal.
# - reliability: Weight in [0.0, 1.0] used by the Resolution Agent
#   during consensus polling. Higher = more authoritative.
# - country_filter: Optional ISO country code filter (e.g. "IT").
#
# To add a new portal, append an entry below. It will be picked up
# automatically by the Scout crew on the next run.

portals:
