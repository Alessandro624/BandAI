crawl_task:
  description: >
    Search {portal_name} for public IT/cloud/cybersecurity tenders aimed at
    Italian public administrations.

    Relevant CPV codes: 72000000, 72212517, 48900000, 72315000. Company ATECO
    codes: {ateco_codes}. Portal entry URL: {portal_url}

    Return a JSON array of RawContract objects with keys: portal, url, title,
    contract_id, contracting_authority, deadline, value_eur, cpv_codes, raw_text.

    Use the TenderCrawlerTool to perform the search, then return ONLY the raw
    JSON array produced by the tool. Do NOT include tool call JSON, markdown
    fences, explanations, or example placeholders like "...".
  expected_output: >
    A JSON array of RawContract dicts. Every field that cannot be found must be
    set to null rather than omitted. No extra text before or after the array.
  agent: crawler_agent

# resolution_task:
#   description: >
#     You have received the tender lists from all Crawler agents (in context).
#     Perform the following steps:

#     1. DEDUPLICATION
#        Group entries with the same Contract ID.
#        If Contract ID is absent, group by (contracting_authority + value_eur ± 5%).

#     2. CONSENSUS POLLING
#        Apply the fixed portal reliability weights below - do NOT alter them:
#     {portal_weight_table}

#        For each duplicate group:
#        - Select the canonical record from the highest-weight portal.
#        - On a tie, prefer the entry with the most non-null fields.
#        - consensus_score = (winning_portal_weight) x
#          (portals_that_listed_this / total_portals_crawled)

#     3. OUTPUT
#        Return a JSON array of ResolvedContract objects sorted by
#        value_eur descending (biggest opportunity first).
#        Required fields: canonical_contract_id, title, contracting_authority,
#        deadline, value_eur, cpv_codes, sources, consensus_score, canonical_url.

      #  The context records are TenderInfo objects. Map them to ResolvedContract
      #  exactly as follows:
      #  - canonical_contract_id: use cig; if absent use cup; if absent use url.
      #  - title: copy title; if absent use "Unknown tender".
      #  - contracting_authority: use contracting_authority.name; if absent use "Unknown authority".
      #  - deadline: copy deadline; if absent use "Unknown deadline".
      #  - value_eur: use max_amount; if absent use base_amount; if absent use null.
      #  - cpv_codes: use cpv; if absent use an empty array [].
      #  - sources: include portal and canonical url when available; never return [].
      #  - consensus_score: use the winning portal reliability weight from the table.
      #  - canonical_url: copy url; if absent use "".

    4. OUTPUT RULES (mandatory):
       Return ONLY the raw JSON array. No introductory text, no explanation,
       no markdown fences. The response must start with '[' and end with ']'.
       value_eur must be a number (float), never a string with currency symbols.
       canonical_url must be a string; use "" if unknown, never null.
       Do not return null for any field except value_eur.
  expected_output: >
    A JSON array of ResolvedContract objects, deduplicated and ranked by
    value_eur descending.
    A raw JSON array starting with '[' and ending with ']'.
    No text before or after the array.
  agent: resolution_agent

preference_filter_task:
  description: >
    You have the full list of ResolvedContracts from the Resolution Agent (context).

    USER PREFERENCES (natural language):
    {user_preferences}

    Instructions:
      1. Filter out contracts that clearly contradict the preferences.
      2. Re-rank the remaining ones by fit with preferences (not just value_eur).
      3. For each kept contract add a one-line fit_reason.
      4. For each removed contract add a one-line removal_reason.
      5. Return the filtered + ranked JSON array.

    NOTE: the human will review your output before it is finalised.
    They may add further instructions or corrections in natural language.

    OUTPUT:
      Return a JSON array of ResolvedContract objects sorted by
      value_eur descending (biggest opportunity first).
      Required fields: canonical_contract_id, title, contracting_authority,
      deadline, value_eur, cpv_codes, sources, consensus_score, canonical_url.

    OUTPUT RULES (mandatory):
      Return ONLY the raw JSON array. No introductory text, no explanation,
      no markdown fences. The response must start with '[' and end with ']'.
      value_eur must be a number (float), never a string with currency symbols.
      canonical_url must be a string; use "" if unknown, never null.
      Do not return null for any field except value_eur.
  expected_output: >
    A filtered, ranked JSON array of ResolvedContract objects with fit_reason
    added to each entry.
    A raw JSON array starting with '[' and ending with ']'.
    No text before or after the array.
  agent: preference_filter_agent

discovery_task:
  description: >
    Search the {portal_name} portal for public tenders aimed at Italian
    public administrations. The TendersOverviewExtractorTool will return
    a Markdown containing a list of tenders. Parse the Markdown and extract
    each tender you find. Collect exactly {tenders_count} tender overviews.

    For each tender found, parse the information of the following fields:
    - title: tender title if available, null otherwise
    - url: direct URL to the tender detail page (required)
    - portal: always '{portal_name}'
    - access_mode: 'html' for web pages, 'api' for API endpoints
    - metadata: any additional data available (deadline, CIG)

    Rules:
    - Do not guess missing fields, use null
    - Return exactly the JSON schema as specified

    IMPORTANT: Your final answer must be ONLY the raw JSON array.
    Do not write explanations, do not use markdown code blocks,
    do not add any text before or after the JSON.
    Do NOT return tool-call JSON.
    Do NOT return the Markdown you loaded. Convert the Markdown content into
    TenderOverview objects and return only the JSON array.
  expected_output: >
    A valid object following the TenderOverview schema:
    [
      {
        "title": "string or null",
        "url": "https://...",
        "portal": "string",
        "access_mode": "html",
        "metadata": {}
      }
    ]
  agent: discovery_agent

extraction_task:
  description: >
    You are given a list of {tenders_count} tenders from the {portal_name} portal.
    For each of the tenders in the list you must:

    1. Load the tender detail page at its URL.
    
    2. Extract all available information from the page and build a TenderInfo object.
    
      Fields to extract:
      - cig: Codice Identificativo Gara
      - cup: Codice Unico di Progetto
      - title: full tender title
      - url: the page URL
      - cpv: list of CPV codes
      - contract_type: i.e Services / Supplies / Works
      - contracting_authority: name and tax_code
      - base_amount: base auction amount in euros
      - max_amount: maximum value including renewals
      - publication_date: ISO format (YYYY-MM-DD)
      - deadline: bid submission deadline, ISO format
      - contract_duration_months: integer
      - url_docs: list of links to documents and attachments

    3. After processing ALL {tenders_count} tenders, collect
       every TenderInfo into a single JSON array and return it as
       your final answer. Do not return partial results mid-loop.

    Rules:
    - Set missing fields to null, never guess
    - Preserve all document links found on the page
    - Return status 'partial' if less than half the fields are populated

    IMPORTANT: Your final answer must be ONLY the raw JSON array.
    Do not write explanations, do not use markdown code blocks,
    do not add any text before or after the JSON.
    Do NOT return tool-call JSON.
    Do NOT narrate your extraction process.
    Do NOT write phrases like "we need to extract" or "let's start".
    Do NOT return the Markdown you loaded. Convert the Markdown content into
    TenderInfo objects and return only the JSON array.
    Your final answer must start with '[' and end with ']'.
  expected_output: >
    A valid array of objects following the TenderInfo schema:
    [
      {
        "cig": "string or null",
        "cup": "string or null",
        "title": "string",
        "url": "https://...",
        "cpv": ["code1", "code2"] or null,
        "contract_type": "string or null",
        "contracting_authority": {"name": "string or null", "tax_code": "string or null"} or null,
        "base_amount": float or null,
        "max_amount": float or null,
        "publication_date": "YYYY-MM-DD or null",
        "deadline": "YYYY-MM-DDTHH:MM:SS or null",
        "contract_duration_months": integer or null,
        "url_docs": ["https://..."] or null,
        "portal": "string",
        "status": "success" or "partial" or "error",
        "error": null
      }
    ]
  agent: extraction_agent

resolution_task:
  description: >
    You are given {portals_count} list of {tenders_count} tenders each.
    Your job is to do the following:

    1. DEDUPLICATION
       Group entries with the same Contract ID.
       If Contract ID is absent, group by (Contracting Authority + Tender Amount ± 5%).

    2. CONSENSUS POLLING
       Apply the fixed portal reliability weights below - do NOT alter them:
    {portal_weight_table}

       For each group of duplicates, select a SINGLE RECORD from the highest-weight portal.
       On a tie, prefer the entry with the most non-null fields.
       The Consensus Score is computed (winning_portal_weight) x
         (portals_that_listed_this / total_portals_crawled)

    3. After processing ALL the tenders, collect every Tender into a single 
       JSON array, SORTED by the Tender Amount in DESCENDING order.
       If the amount is null, treat it as 0 but leave null as value.
       Then, return it as your final answer. Do not return partial results mid-loop.

    REQUIRED Fields:
    - canonical_contract_id: Codice Identificativo Gara (CIG)
    - title: full tender title
    - contracting_authority: Name of Contracting Authority [tax code if given]
    - deadline: bid submission deadline, ISO format
    - value_eur: auction amount in euros (float)
    - cpv_codes: list of CPV codes
    - sources: list of Portal where the tender was present
    - consensus_score: Consensus Score, 
    - canonical_url: url of the Tender Page

    Rules:
    - Set missing fields to null, never guess

    IMPORTANT: Your final answer must be ONLY the raw JSON array.
    Do not write explanations, do not use markdown code blocks,
    do not add any text before or after the JSON.

    {current_date}
  expected_output: >
    A valid array of objects following the ResolvedContract schema:
    [
      {
        "canonical_contract_id": "string or null",
        "title": "string",
        "contracting_authority": "string or null",
        "deadline": "YYYY-MM-DDTHH:MM:SS or null",
        "value_eur": float or null,
        "sources" ["TED", "ANAC", ...],
        "consensus_score": float
        "cpv_codes": ["code1", "code2"] or null,
        "canonical_url": "https://..."
      }
    ]
  agent: resolution_agent
